# Prometheus scrape configuration for the local/docker-compose stack
# (Phase 21). Both targets are the app containers' own service names -
# reachable by name on the default compose network, no host port
# mapping required for scraping to work inside the stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9808"]
