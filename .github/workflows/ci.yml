name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (lint + migrate + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: commercepilot
          POSTGRES_PASSWORD: commercepilot
          POSTGRES_DB: commercepilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commercepilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://commercepilot:commercepilot@localhost:5432/commercepilot_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations are reversible (upgrade / downgrade / upgrade)
        working-directory: .
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest

  packages:
    name: Shared packages (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check packages/shared packages/domain packages/connectors

  connectors:
    name: Connectors (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/connectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/connectors/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  worker:
    name: Worker (import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "from worker.celery_app import app; from worker.tasks.health import ping; assert ping.run() == 'pong'"

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose-build:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
